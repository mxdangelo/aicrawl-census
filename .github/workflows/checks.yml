name: Checks

# Lint, the parser and pipeline tests, and a dashboard render that publishes
# nothing: a pull request learns here what would break main or the live site.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The tests use the standard library only; ruff is the one tool to install.
      - name: Lint
        run: pip install ruff && ruff check .

      - name: Parser tests
        run: python test_parsers.py

      - name: Pipeline test
        run: python test_pipeline.py

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install render dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Render
        run: quarto render dashboard
